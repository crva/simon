services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q8_0}
      # Keep the model loaded in VRAM indefinitely once warmed up below —
      # without this it unloads after 5min idle and the next voice command
      # pays a cold-load cost that can exceed the bot's request timeout.
      OLLAMA_KEEP_ALIVE: "-1"
    # Starts the server, waits for it to be up, pulls the model (instant on
    # later restarts — already-pulled models are cached in the volume), then
    # runs one generation to force it into VRAM so the first real voice
    # command doesn't pay that load cost instead.
    entrypoint:
      [
        "sh",
        "-c",
        "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$OLLAMA_MODEL\" && ollama run \"$OLLAMA_MODEL\" hi; wait",
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped
    healthcheck:
      # "healthy" here means the model is pulled AND warmed into VRAM, not
      # just that the server is up — that's what `bot` actually depends on.
      test: ["CMD-SHELL", "ollama ps | grep -q \"$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Overrides .env's OLLAMA_BASE_URL: Ollama is its own service here,
      # reachable by name on the compose network.
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./vosk/models:/app/vosk/models:ro
      - ./whisper/models:/app/whisper/models:ro
      - ./music:/app/music
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

volumes:
  ollama_data:
