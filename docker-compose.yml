services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: pulls the model into ollama's volume on first run. Already
  # pulled models are cached there, so this is instant on later restarts.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q8_0}"]
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Overrides .env's OLLAMA_BASE_URL: Ollama is its own service here,
      # reachable by name on the compose network.
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./vosk/models:/app/vosk/models:ro
      - ./whisper/models:/app/whisper/models:ro
      - ./music:/app/music
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

volumes:
  ollama_data:
